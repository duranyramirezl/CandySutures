# Candy Sutures

### Inspiratie voor mijn Digital Garden

Een persoonlijke plek voor kunst, muziek, films en andere interesses.

# 1. Het concept: Candy Sutures

Candy Sutures is mijn artiestennaam op het internet.
Ik ben vooral actief op Newgrounds, een platform voor Flash-games, digitale kunst en animaties.

De naam past bij mijn persoonlijke kunststijl en smaak. Ik combineer graag zoete en schattige elementen met enge, ongemakkelijke en soms bloederige elementen.

Mijn Digital Garden wordt een persoonlijke website waar ik mijn interesses, creativiteit en ervaringen kan verzamelen en delen.

---

# 2. Mijn interesses

Mijn website krijgt vier hoofdcategorieën:

- **Art:** Mijn eigen digitale kunst en creatieve projecten.
- **Music:** Albums die ik heb beluisterd en beoordeeld.
- **Films:** Films en andere media die ik heb bekeken en beoordeeld.
- **Blog:** Persoonlijke blogs, dagboekfragmenten, reisverslagen en andere onderwerpen.

Het doel is om een persoonlijke verzameling te maken die steeds verder kan groeien.

---

# 3. Visuele identiteit

### Motieven

- Strepen
- Candy & Sweets
- Medical devices
- Brains & Blood
- The undead

### Subcultuur

DIY- en emo-subcultuur.

Vooral de combinatie van schattige en enge elementen past bij de emo-stijl uit het midden van de jaren 2000.

Deze subcultuur is ook persoonlijk belangrijk voor mij, omdat ik zelf vroeger emo was en dat nog steeds ben.

---

# 4. Belangrijkste inspiratie: Fukuomori

Een groot deel van mijn inspiratie komt uit Fukuomori, een Japans puzzelspel voor de Nintendo DS.

Het spel heeft een schattige, maar tegelijkertijd spooky.

Ik heb dit spel ook gekozen omdat ik veel inspiratie kan halen uit de gebruikersinterface (UI). Denk bijvoorbeeld aan knoppen, menu's, icoontjes en andere spelelementen.

![Fukuomori inspiratie](./images/collage_fukuomori_inspiratie.jpg)

# 9. Muziekinspiratie

### Chiodos - Baby, You Wouldn't Last A Minute On The Creek

Dit is een nummer waar ik erg van houd. Het genre is post-hardcore.

Ik vind vooral het contrast tussen de zachte, hoge zang en de schreeuwende zang interessant.

Ook de instrumentale muziek heeft iets fantasierijks. Het nummer voelt bijna als een wereld waar je zelf in kunt stappen.

Eigenlijk had ik bijna elk nummer van mijn favoriete post-hardcorebands kunnen kiezen, omdat dit genre mij veel creatieve inspiratie geeft.

[Luister op YouTube](https://www.youtube.com/watch?v=bg1dF4TpI0k)

---

# 10. Animatie-inspiratie

### RATBASTERDZ: JAY'S DAY - Jon Sherin

Dit is een van mijn favoriete korte animatieseries op Newgrounds. Ik vind de serie erg grappig en vooral de combinatie met muziek spreekt mij aan.

Wat ik ook interessant vind, is dat de personages en verhalen gebaseerd lijken te zijn op de vriendschappen en ervaringen van de maker in de jaren 2000.

Ook de ringtone van Jay vind ik geweldig. Het past perfect bij de post-hardcoremuziek en de sfeer van die tijd.

[Bekijk op YouTube](https://www.youtube.com/watch?v=yI-u7-3pMHY)
